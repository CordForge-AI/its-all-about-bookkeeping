name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-production
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "198.38.90.25 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIBoOCtonIj9TIBpMaPw+hv25nnCrGSAtPdtzZdMsZSpG" > ~/.ssh/known_hosts

      - name: Deploy dist/ to Enhance
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 22 -o UserKnownHostsFile=~/.ssh/known_hosts" \
            dist/ itsallab2@198.38.90.25:public_html/
